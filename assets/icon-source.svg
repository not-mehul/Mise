<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Master icon (style.md §14: the Dusk bg-grad-mid ground, a serif glyph
       in accent-amber, a 1px amber hairline frame). `npm run icons` renders
       every launcher asset from it: #disk is the backdrop, #mark the serif M. -->
  <g id="disk">
    <rect width="512" height="512" fill="#0f0d0b"/>
    <rect x="40" y="40" width="432" height="432" fill="none" stroke="#d4a574" stroke-width="2" opacity="0.6"/>
  </g>
  <g id="mark">
    <!-- A Didone-style capital M: hairline left stem and diagonal, heavy right
         diagonal and stem, bracketed slab serifs. -->
    <path fill="#d4a574" d="
      M 140 352 L 140 344 L 156 340 L 156 172 L 140 168 L 140 160 L 206 160
      L 262 300 L 316 160 L 372 160 L 372 168 L 356 172 L 356 340 L 372 344 L 372 352
      L 288 352 L 288 344 L 306 340 L 306 206 L 250 352 L 242 352 L 166 196
      L 166 340 L 184 344 L 184 352 Z"/>
  </g>
</svg>
