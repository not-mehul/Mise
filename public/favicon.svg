<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Master icon (style.md §14: the Dusk bg-grad-mid ground, a Lucide-style
       mark in accent-amber, a 1px amber hairline frame). `npm run icons` renders
       every launcher asset from it. This copy is the browser tab icon. -->
  <g id="disk">
    <rect width="512" height="512" fill="#0f0d0b"/>
    <rect x="40" y="40" width="432" height="432" fill="none" stroke="#d4a574" stroke-width="2" opacity="0.6"/>
  </g>
  <g id="mark">
    <!-- Steam: three wisps, the middle one tallest. -->
    <g fill="none" stroke="#d4a574" stroke-width="16" stroke-linecap="round">
      <path d="M200 226 C178 200 222 178 200 146"/>
      <path d="M256 226 C230 194 282 164 256 120"/>
      <path d="M312 226 C290 200 334 178 312 146"/>
    </g>
    <!-- Rim, bowl and foot. -->
    <rect x="118" y="248" width="276" height="22" rx="11" fill="#d4a574"/>
    <path fill="#d4a574" d="M136 282 H376 A120 108 0 0 1 136 282 Z"/>
    <rect x="214" y="386" width="84" height="16" rx="6" fill="#d4a574"/>
  </g>
</svg>
